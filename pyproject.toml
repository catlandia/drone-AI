[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-ai"
version = "0.1.0"
description = "AI-powered drone flight learning system with sim-to-real transfer capabilities"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Drone AI Team"}
]
keywords = ["drone", "AI", "reinforcement-learning", "simulation", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "gymnasium>=0.29.0",
    "matplotlib>=3.7.0",
    "pygame>=2.5.0",
    "tensorboard>=2.14.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
real = [
    "cflib>=0.1.0",  # Crazyflie drone library
    "djitellopy>=2.4.0",  # DJI Tello drone library
]

[project.scripts]
drone-train = "drone_ai.train:main"
drone-eval = "drone_ai.evaluate:main"
drone-viz = "drone_ai.visualize:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100
